# Production : backend (8000) + frontend nginx (8080 sur l'hôte).
# Caddy occupe les ports 80/443 - voir deploy/Caddyfile.example
#
# Avant le build frontend :
#   cp env.prod.example .env
#   # éditer VITE_API_BASE=https://votre-domaine.com/api
#
# Sur le VPS :
#   docker compose -f docker-compose.prod.yml up -d --build
#   sudo cp deploy/Caddyfile.example /etc/caddy/Caddyfile  # adapter le domaine
#   sudo systemctl reload caddy

services:
  backend:
    # Build depuis le repo (git pull) : l'image Hub peut être en retard vs routes /api/business/*
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: thelouitos/tesla-fleet-backend:latest
    env_file:
      - ./backend/.env.prod
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend_keys:/app/app/keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://teslapi.axelproject.fr/api}
    ports:
      # 8080 : Caddy garde 80/443 sur l'hôte
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_keys:
